name: Values Commons verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: values-commons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project health
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the pulse feed + freshness report read git log

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Pillow
        # pipeline/build_icon.py (added 2026-08-16) rasterises the app icon with it. Without it the
        # build died on its first step, dist/ was never made, and every push from 2026-08-17 failed.
        run: python -m pip install --quiet pillow

      - name: Build the public site and reconcile release fingerprints
        # dist/ is gitignored, so CI must build it before the dist-aware audits inside verify:full
        # (release observability, package-mode fingerprints). prepare:public runs its own verify pass
        # that trips on the not-yet-reconciled fingerprints, so tolerate that one exit; status:write
        # then rewrites docs/PROJECT-STATUS.md to match the freshly built dist, which verify:full checks.
        run: |
          npm run prepare:public || true
          npm run audit:release-modes
          npm run status:write

      # NOTE: `npm run audit:generated` is a LOCAL pre-commit check, not a CI gate. It byte-compares
      # a fresh rebuild against the committed generated files, which cannot hold cross-platform: the
      # guide/markdown build and rasterized card images differ between the Windows machine that
      # authors them and Linux CI. Correctness is gated by verify:full below (links, structure,
      # conformance, tests) — which is platform-independent. Run `npm run audit:generated` before
      # committing to catch a forgotten regeneration.

      - name: Run full verification gate
        run: npm run verify:full

      - name: Smoke-test release package modes
        run: npm run audit:release-modes

      - name: Report package status
        run: npm run release:status
