# The audits run on every push and pull request, so "the build fails when a number drifts" is a
# statement about this repository rather than about one laptop. It proves; it never deploys, and it
# holds no credentials (research/ci_config_audit.js checks both).
name: Values Commons verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run verify:full
      - run: npm run audit:release-modes
      - run: npm run release:status
