name = "consciousconsuming"
compatibility_date = "2026-07-02"
main = "worker.js"

# The Worker runs first (worker.js: the host-aware front door), then falls through to these assets.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "valuescommons.org"
custom_domain = true

[[routes]]
pattern = "www.valuescommons.org"
custom_domain = true

[[routes]]
pattern = "consciousconsuming.org"
custom_domain = true

[[routes]]
pattern = "www.consciousconsuming.org"
custom_domain = true
